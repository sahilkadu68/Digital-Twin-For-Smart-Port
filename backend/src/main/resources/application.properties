# Smart Port Digital Twin — Backend Configuration
# MongoDB connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/smart_port_digital_twin}

# Server port
server.port=8081

# Application name
spring.application.name=smart-port-digital-twin

# CORS — allow local frontend dev server
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Simulated data — set to true to seed the database on startup if empty
app.data.seed-on-startup=false

# Session authentication: HTTPS deployments MUST set SESSION_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=8KB
server.max-http-request-header-size=16KB
app.auth.registration-enabled=${AUTH_REGISTRATION_ENABLED:true}
app.auth.rate.window-seconds=${AUTH_RATE_WINDOW_SECONDS:900}
app.auth.rate.ip-limit=${AUTH_RATE_IP_LIMIT:30}
app.auth.rate.account-limit=${AUTH_RATE_ACCOUNT_LIMIT:10}
